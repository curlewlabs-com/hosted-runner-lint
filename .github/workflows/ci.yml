name: CI

# Every pull request and push to main runs the checks a contributor runs
# locally. The weekly run catches what changes outside this repository - the
# runner images and the python3, git and yq they carry - before a user does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned tools
        run: python -m pip install -r requirements-dev.txt
      - name: mypy (strict)
        run: mypy

  test:
    # The oldest Python the package supports, and the python3 each runner
    # image ships, on Linux x86_64 and arm64 and on macOS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: "3.12"
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v

  action:
    # The action as a consumer runs it, on this repository's own tree, which
    # must stay clean; and on a finding it must report.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: This repository passes
        uses: ./
      - name: Add a finding, and modules named like the lint's and json
        # A repository being judged can hold a file named like the lint's own
        # package or a standard module it imports; were either imported in its
        # place, the lint would pass. The json stand-in reads every
        # workflow as one with no jobs.
        run: |
          printf 'on: push\njobs:\n  a:\n    runs-on: self-hosted\n' > .github/workflows/bad.yml
          printf 'pass\n' > hosted_runner_lint.py
          printf 'def loads(*args, **kwargs):\n    return {"jobs": {}}\n' > json.py
          git add .github/workflows/bad.yml hosted_runner_lint.py json.py
      - name: The action reports the finding
        id: judged
        continue-on-error: true
        uses: ./
        # An inherited import path naming the judged directory must not put
        # those files back in front of the lint's own.
        env:
          PYTHONPATH: .
      - name: Require that it failed
        env:
          OUTCOME: ${{ steps.judged.outcome }}
        run: test "$OUTCOME" = failure

  baseline:
    # The checks every Curlew Labs repository runs, in one place:
    # https://github.com/curlewlabs-com/ci-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: curlewlabs-com/ci-baseline@775916d9645e213f5ceb13ffba27e675e547cbc3 # v0.3.6

  conclusion:
    # The one check branch protection requires, so adding or renaming a job
    # above needs no settings change - only this list.
    needs: [lint, test, action, baseline]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          ACTION: ${{ needs.action.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: test "$LINT" = success && test "$TEST" = success && test "$ACTION" = success && test "$BASELINE" = success
